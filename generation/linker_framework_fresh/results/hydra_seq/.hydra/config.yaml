data:
  train_sample_limit: null
  val_sample_limit: null
  seq_dir: ${paths.data_dir}/seqs
  dataset_prefix: mof_sequence
  vocab_path: ${data.seq_dir}/vocab.json
  max_len: null
  loader:
    num_workers: 16
    prefetch_factor: 10
    max_tokens: 8000
    max_batch_size: null
model:
  conditional: false
  max_seq_len: 2048
  attention:
    dim: 1024
    depth: 6
    heads: 8
    rotary_pos_emb: true
    attn_flash: true
    use_scalenorm: true
experiment:
  project: mof-seq
  name: test
  debug: false
  seed: 123
  num_devices: 8
  warm_start: null
  warm_start_cfg_override: true
  sample_seq_freq: 500
  use_ema: false
  ema:
    decay: 0.999
    apply_ema_every_n_steps: 1
    start_step: 0
    evaluate_ema_weights_instead: true
  optimizer:
    lr: 0.0003
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
  lr_scheduler_type: null
  lr_scheduler:
    linear_warmup:
      warmup_epochs: 10
      min_lr: 1.0e-07
    reduce_on_plateau:
      factor: 0.6
      patience: 10
      min_lr: 1.0e-06
  trainer:
    overfit_batches: 0
    min_epochs: 10
    max_epochs: 20
    accelerator: gpu
    log_every_n_steps: 1
    deterministic: false
    strategy: ddp
    val_check_interval: 1.0
    check_val_every_n_epoch: 1
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
  checkpointer:
    dirpath: ${paths.ckpt_dir}
    monitor: step
    save_last: true
    save_top_k: 5
    filename: epoch_{epoch}-step_{step}-loss_{valid/loss:.4f}
    auto_insert_metric_name: false
    mode: max
logger: wandb
wandb:
  name: ${experiment.name}
  project: ${experiment.project}
  save_dir: ${paths.logger_dir}
wandb_watch:
  log: all
  log_freq: 500
tensorboard:
  name: tensorboard
  version: ${experiment.project}/${experiment.name}
  save_dir: ${paths.logger_dir}
  log_graph: false
  default_hp_metric: true
callbacks:
  tensorboard:
    log_freq: ${experiment.trainer.log_every_n_steps}
    log_grad_hist: false
    log_weight_hist: false
    log_grad_norm: true
    log_weight_norm: true
    log_norm_input: true
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  log_dir: ${paths.root_dir}/logs/${experiment.project}/${experiment.name}
  logger_dir: ${paths.root_dir}/logs
  ckpt_dir: ${paths.log_dir}/ckpt
  inference_dir: ${paths.log_dir}/inference
  data_dir: ${paths.root_dir}/data
inference:
  ckpt_path: /share/rickyswork/ai_mof/generation/linker_framework_fresh_20261113/seq_module_cond/ckpt.pt
  seed: 719
  total_samples: 200
  batch_size: 50
  max_seq_len: 2048
  temperature: 1.0
  target_property: 5.0
